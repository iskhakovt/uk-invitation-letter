# Starter data file for uk-invitation-letter.
# Replace the sample values with your own data.

inviter:
  name: Your Name  # spaces never break across lines; special characters (& % # _ etc.) are escaped for you
  address:
    - 123 Example Street
    - Example City EC1A 1AA
  phone: "07700900000"
  email: you@example.com
  status: null  # optional, completes "I am ...": e.g. `a British citizen` or `in the UK on a Skilled Worker visa valid until 1 May 2028`
  residence: share code  # optional: `share code` (eVisa) / `passport` (British or Irish citizens) / custom
  proof_of_address: tenancy agreement  # optional: tenancy agreement, mortgage statement or title deeds; GOV.UK says not to use council tax or utility bills

employer:  # optional — delete this block if not applicable
  name: Example Employer Ltd
  address:
    - 1 Office Road
    - Example City EC2A 2BB

embassy:
  name: British Embassy Example
  address:
    - 1 Embassy Square
    - Example City
    - Example Country

invitee:
  name:  # <first name> [<other names>]+ <last name>; write `Mary~Ann Smith` to keep a two-word first name together
    - Invitee Name
  pronoun: null  # optional, e.g. she/her/her for a single invitee; a group is always they/them/their
  relationship: friend

trip:
  arrival_date: 2026-01-01
  departure_date: 2026-01-15
  reason: null  # optional, only when the visit is for an event in your life, e.g. `my graduation ceremony on 15 January 2026`
  return_reason: null  # optional
  return_country: null  # optional
  financial_support: false  # true if you pay for the trip; the letter then lists your recent bank statements

docs: []  # optional: extra documents, e.g. `letter from my university confirming my enrolment` or `birth certificate`
