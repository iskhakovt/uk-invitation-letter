version: 2.1

# Releases are not cut on every merge. To release the head of main, trigger a
# pipeline on main with the `release` parameter set to true:
#
#   Web app: project Pipelines page -> "Trigger Pipeline" -> branch main ->
#   "Add +" parameter `release` (boolean) = true -> "Run Pipeline".
#
#   API: POST https://circleci.com/api/v2/project/<provider>/<org>/<repo>/pipeline/run
#   with body {"definition_id": "<from Project Settings > Pipelines>",
#   "config": {"branch": "main"}, "checkout": {"branch": "main"},
#   "parameters": {"release": true}}. See docs/guides/orchestrate/triggers-overview.
#
# The `release` workflow re-runs the tests, then semantic-release versions from
# every commit since the last tag and pushes the tag, which runs `cd` below.
parameters:
  release:
    type: boolean
    default: false

orbs:
  python: circleci/python@4.0.0

jobs:
  test:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    resource_class: small
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: uv
          args: --python << parameters.python-version >>
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyrefly check
      - run: uv run pytest

  render-test:
    docker:
      - image: texlive/texlive:latest-small
    resource_class: small
    environment:
      TEXMFHOME: /root/texmf
    steps:
      - checkout
      - restore_cache:
          keys:
            - texmf-v1-{{ checksum ".circleci/texlive-packages.txt" }}
            - texmf-v1-
      - run:
          name: Install LaTeX packages via tlmgr
          command: |
            REPO=https://mirror.ox.ac.uk/sites/ctan.org/systems/texlive/tlnet
            [ -d /root/texmf ] || tlmgr --repository "$REPO" init-usertree
            tlmgr --repository "$REPO" --usermode --usertree /root/texmf install $(cat .circleci/texlive-packages.txt)
      - save_cache:
          key: texmf-v1-{{ checksum ".circleci/texlive-packages.txt" }}
          paths:
            - /root/texmf
      - run:
          name: Install diff-pdf and curl
          command: |
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends diff-pdf-wx ca-certificates curl
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
            echo 'export PATH=$HOME/.local/bin:$PATH' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - uv-v1-{{ checksum "uv.lock" }}
            - uv-v1-
      - run: uv sync
      - save_cache:
          key: uv-v1-{{ checksum "uv.lock" }}
          paths:
            - /root/.cache/uv
      - run: uv run pytest -m render
      - store_artifacts:
          path: tests/_artifacts

  publish:
    docker:
      - image: cimg/python:3.14
    resource_class: small
    steps:
      - checkout
      - run: uv build
      - run: uv publish

  release:
    docker:
      - image: cimg/node:lts
    resource_class: small
    steps:
      - checkout
      # conventional-changelog-conventionalcommits stays on 9.x: 10.x needs
      # conventional-changelog-writer@9, and release-notes-generator still
      # ships writer 8. Bump them together.
      - run: |
          npx -y \
            -p semantic-release@25.0.9 \
            -p @semantic-release/commit-analyzer@13.0.1 \
            -p @semantic-release/release-notes-generator@14.1.1 \
            -p @semantic-release/github@12.0.10 \
            -p conventional-changelog-conventionalcommits@9.3.1 \
            semantic-release

workflows:
  ci:
    unless: << pipeline.parameters.release >>
    jobs:
      - test:
          matrix:
            parameters:
              python-version: ["3.11", "3.14"]
      - render-test
  release:
    when: << pipeline.parameters.release >>
    jobs:
      - test:
          matrix:
            parameters:
              python-version: ["3.11", "3.15"]
      - render-test
      - release:
          requires:
            - test
            - render-test
          filters:
            branches:
              only: main
  cd:
    jobs:
      - test:
          matrix:
            parameters:
              python-version: ["3.11", "3.15"]
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/
      - render-test:
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/
      - publish:
          context: pypi-public
          requires:
            - test
            - render-test
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/
